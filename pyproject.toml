[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cu-recap"
version = "0.2.0"
description = "Correction-Utility-Aware RECAP research prototype"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["cu_recap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
